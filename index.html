<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prodigy</title>
<link rel="icon" type="image/png" href="https://ws.ankomstudios.com/icons/prodigy-definitive-edition/icon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Ubuntu:regular,bold&subset=Latin">
    <link rel="stylesheet" href="./style.css">

    <style>
        body {
            cursor: pointer;
        }

        #redirect-message {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            font-family: Ubuntu, sans-serif;
            font-size: 18px;
            z-index: 9999;
        }
    </style>
</head>

<body>
    <div id="redirect-message">
        Redirecting to Old Prodigy...
    </div>

    <script>
        const destination = "/oldprodigy";
        let redirectStarted = false;

        // Attempt the automatic redirect immediately.
        window.location.replace(destination);

        // Enable the fallback click after 3 seconds.
        setTimeout(() => {
            if (!redirectStarted) {
                document.getElementById("redirect-message").textContent =
                    "Click anywhere to redirect to Old Prodigy";
            }
        }, 3000);

        // Ignore clicks during the first 3 seconds.
        document.addEventListener("click", () => {
            if (Date.now() - startTime < 3000 || redirectStarted) {
                return;
            }

            redirectStarted = true;
            window.location.href = destination;
        });

        const startTime = Date.now();
    </script>
</body>
</html>
